name: push-github
on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: linux-host
    steps:
      - name: clone and push to GitHub
        run: |
          set -e
          rm -rf /tmp/graft-mirror
          git clone --bare https://f1.cyberwild.org/forgeadmin/graft.git /tmp/graft-mirror
          cd /tmp/graft-mirror
          git push "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/jeanbaptiste/graft.git" main:main
          rm -rf /tmp/graft-mirror
